name: Scorecard

# OpenSSF Scorecard: supply-chain checks (pinned actions, token permissions,
# branch protection, …). Results go to the Security tab and to the public
# badge in the README.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  # Re-run after changing branch protection.
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write # upload SARIF to code scanning
      id-token: write # publish results for the badge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: results.sarif
